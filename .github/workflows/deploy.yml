# .github/workflows/deploy.yml
name: ledger-query CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod, staging]
      plan_only:
        description: Plan only (no apply)
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.8.3
  GO_VERSION: 1.22

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - run: go test ./... -race -count=1 -timeout 60s

  deploy:
    name: Deploy (${{ github.event.inputs.env || 'prod' }})
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ github.event.inputs.env || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - uses: azure/setup-kubectl@v3

      - name: Deploy
        run: |
          PLAN_FLAG=""
          [[ "${{ github.event.inputs.plan_only }}" == "true" ]] && PLAN_FLAG="--plan-only"
          bash scripts/deploy.sh \
            --env ${{ github.event.inputs.env || 'prod' }} \
            --tag $(git rev-parse --short HEAD) \
            --auto-approve \
            $PLAN_FLAG
